name: Actualizar cuadros tarifarios

on:
  schedule:
    - cron: "0 9 * * *"   # todos los días 06:00 ART
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", "site/*.html", "site/*.js", "site/*.css"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python scraper/run.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: actualización automática $(date -u +%F)"
          git push
      - name: Detectar extractores rotos
        continue-on-error: true
        run: python scraper/check.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
