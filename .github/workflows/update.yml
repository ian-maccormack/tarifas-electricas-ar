name: Actualizar cuadros tarifarios

on:
  schedule:
    - cron: "0 9 * * *"   # todos los días 06:00 ART
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", "tests/**", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Debian image: the runners' Ubuntu apt mirrors stopped resolving (Nov 2026); deb.debian.org is separate.
    container: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Instalar poppler y tesseract
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            timeout 180 apt-get update && timeout 300 apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa libgl1 libglib2.0-0 && exit 0
            sleep 30
          done
          exit 1
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python scraper/run.py
      - name: Commit data
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: actualización automática $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push
      - name: Detectar extractores rotos
        continue-on-error: true
        run: python scraper/check.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
